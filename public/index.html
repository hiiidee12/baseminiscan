<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Base Mini Scan</title>

  <meta property="og:title" content="Base Mini Scan" />
  <meta property="og:description" content="Quick BaseScan lookup on Base Network." />
  <meta property="og:image" content="https://baseminiscan.vercel.app/assets/spx.png" />
  <meta property="og:url" content="https://baseminiscan.vercel.app/" />
  <meta property="og:type" content="website" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Base Mini Scan" />
  <meta name="twitter:description" content="Base Network explorer helper" />
  <meta name="twitter:image" content="https://baseminiscan.vercel.app/assets/spx.png" />

  <link rel="stylesheet" href="/app.css" />
</head>

<body>
  <div class="wrap" id="wrap">
    <div class="card">

      <div class="topTabs">
        <button id="tabHomeTop" class="topTab">HOME</button>
        <button id="tabAiTop" class="topTab secondary">AI MODE</button>
      </div>

      <div class="profile profileCard">
        <img id="pfp" class="pfp" alt="pfp" />
        <div class="profileInfo">
          <div class="profileName" id="fcName">Loading…</div>
          <div class="profileUsername muted" id="fcUser">@-</div>
          <div class="profileBadges">
            <span class="badge" id="fcFid">FID: -</span>
            <span class="badge neynar" id="neynarScore">Neynar: -</span>
          </div>
        </div>
      </div>

      <!-- HOME -->
      <section id="pageHome" data-page="home">
        <h1>Base Mini Scan</h1>

        <div class="row">
          <input
            id="query"
            placeholder="Paste address / tx hash / block number"
            autocomplete="off"
          />
          <button id="open">Open</button>
        </div>

        <div class="sectionHead">
          <div class="sectionTitle">Base Gas Tracker ⛽</div>
          <div class="muted gasNext" id="gasNext">Next update in <b>—</b></div>
        </div>

        <div id="gasOutput"></div>
        <div id="featuredActions" class="featuredCard"></div>
        <div id="additionalInfo"></div>
      </section>

      <!-- AI -->
      <section id="pageAi" data-page="ai" style="display:none">
        <div class="cardTitle">BMS AI</div>

        <div id="aiChat" class="aiChat"></div>

        <div class="aiComposer">
          <input
            id="aiInput"
            type="text"
            placeholder="Paste address + ask something…"
            autocomplete="off"
          />
          <button id="aiSend">Send</button>
        </div>
      </section>

      <!-- DETAIL -->
      <section id="pageDetail" data-page="detail" style="display:none">
        <div class="detailBar">
          <button id="back" class="secondary backBtn">← Back</button>
          <div class="muted" id="link"></div>
        </div>

        <div class="detailHeader">
          <div class="detailLabel muted">Wallet Address</div>
          <div class="detailAddress" id="detailAddress">-</div>

          <div class="detailStats">
            <div class="statBox">
              <div class="muted">Farcaster Username</div>
              <div class="fcUser" id="fcUserDetail">-</div>
            </div>
            <div class="statBox">
              <div class="muted">ETH Balance</div>
              <div class="statValue" id="detailBalance">-</div>
            </div>
            <div class="statBox">
              <div class="muted">Total Transactions</div>
              <div class="statValue" id="detailTxCount">-</div>
            </div>
          </div>
        </div>

        <div class="tabs">
          <button id="tabTx" class="secondary">Transactions</button>
          <button id="tabErc20" class="secondary">ERC-20 Transfers</button>
          <button id="tabInternal" class="secondary">Internal</button>
          <button id="tabNft" class="secondary">NFT Transfers</button>
        </div>

        <div id="detailOutput"></div>
      </section>

    </div>
  </div>

  <script src="/sdk.js"></script>

  <script src="/js/utils.js"></script>
  <script src="/js/featuredActions.js"></script>
  <script src="/js/overviewState.js"></script>
  <script src="/js/router.js"></script>
  <script src="/js/tabs.js"></script>
  <script src="/js/skeletons.js"></script>
  <script src="/js/renderers.js"></script>
  <script src="/js/detail.js"></script>
  <script src="/js/gas.js"></script>
  <script src="/js/ai-ui.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
